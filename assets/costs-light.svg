<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="440" viewBox="0 0 1070 440" role="img" aria-label="What it costs: Claude is included in a Claude subscription, data providers cost cents per account, observability is optional; per-stage orders of magnitude and a real example">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
  <rect width="1070" height="440" rx="16" fill="#ffffff"/>
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">Where the money goes</text>
  <rect x="40" y="58" width="318" height="120" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.25"/>
  <text x="60" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#59636e">Claude</text>
  <text x="60" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a7f37">$0 extra</text>
  <text x="60" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">on a Claude subscription: runs use your plan</text>
  <text x="60" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">with an API key: billed per token</text>
  <rect x="376" y="58" width="318" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="396" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#59636e">Data providers</text>
  <text x="396" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328">cents / account</text>
  <text x="396" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">Exa for search, Firecrawl for pages</text>
  <text x="396" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">both have free tiers, both optional</text>
  <rect x="712" y="58" width="318" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="732" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#59636e">Observability</text>
  <text x="732" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328">optional</text>
  <text x="732" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">Langfuse or LangSmith</text>
  <text x="732" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e">free tiers · Langfuse can be self-hosted</text>
  <text x="40" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">Per account, roughly</text>
  <text x="1030" y="222" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8c959f">indicative · depends on your providers and models · trending down</text>
  <rect x="40" y="238" width="318" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="60" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#1f2328">Discover + light score</text>
  <text x="60" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">well under 1¢ <tspan fill="#59636e" font-weight="400" font-size="12.5">in data providers</tspan></text>
  <text x="60" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8c959f">API key: well under 1¢</text>
  <rect x="376" y="238" width="318" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="396" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#1f2328">Deep research + full score</text>
  <text x="396" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">a few cents <tspan fill="#59636e" font-weight="400" font-size="12.5">in data providers</tspan></text>
  <text x="396" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8c959f">API key: + tens of cents</text>
  <rect x="712" y="238" width="318" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="732" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#1f2328">Ways in + outreach draft</text>
  <text x="732" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328">about 1¢ <tspan fill="#59636e" font-weight="400" font-size="12.5">in data providers</tspan></text>
  <text x="732" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8c959f">API key: + cents to tens of cents</text>
  <rect x="40" y="352" width="990" height="34" rx="17" fill="#fff8c5" stroke="#9a6700" stroke-width="1.25"/>
  <text x="535" y="374" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9a6700">A real first cycle: ~150 companies found · 26 researched · 16 drafted  →  under $1.50 in data providers, Claude on the subscription</text>
  <text x="40" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">Cost estimate before deep research · caps checked before every paid call · every call logged in your workspace</text>
</svg>
