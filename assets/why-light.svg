<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="450" viewBox="0 0 1070 450" role="img" aria-label="The same company as a bought list shows it, and as agentic-sales-engine hands it over: why now, who to talk to, a score with evidence, and a first message, every line sourced">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker></defs>
  <rect width="1070" height="450" rx="16" fill="#ffffff"/>
