<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="400" viewBox="0 0 1070 400" role="img" aria-label="Observability: every run sends traces, quality scores and datasets to Langfuse, LangSmith or any OpenTelemetry backend">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ab7df8"/></marker></defs>
  <rect width="1070" height="400" rx="16" fill="#0d1117"/>
  <rect x="300.0" y="22" width="470" height="28" rx="14" fill="#2e2410" stroke="#d29922" stroke-width="1.25"/>
  <text x="535.0" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d29922">connect once:  ase observability connect langfuse | langsmith</text>
  <rect x="40" y="92" width="250" height="262" rx="12" fill="#0c2d6b" stroke="#1f6feb" stroke-width="1.25"/>
  <text x="60" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#e6edf3">Every run</text>
  <circle cx="66" cy="156" r="3.5" fill="#4493f8"/>
  <text x="80" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">autopilot</text>
  <text x="80" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">steps and gates</text>
  <circle cx="66" cy="194" r="3.5" fill="#4493f8"/>
  <text x="80" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">batches</text>
  <text x="80" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">chunks of accounts</text>
  <circle cx="66" cy="232" r="3.5" fill="#4493f8"/>
  <text x="80" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">Claude sessions</text>
  <text x="80" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">every tool call</text>
  <circle cx="66" cy="270" r="3.5" fill="#4493f8"/>
  <text x="80" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">provider calls</text>
  <text x="80" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">Exa · Firecrawl · cost</text>
  <circle cx="66" cy="308" r="3.5" fill="#4493f8"/>
  <text x="80" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">scoring</text>
  <text x="80" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">levels · evidence · tier</text>
  <rect x="360" y="92" width="360" height="78" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="378" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">Traces</text>
  <text x="702" y="119" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#79c0ff">automatic</text>
  <text x="378" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">what it did, step by step: which pages it read,</text>
  <text x="378" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">which tools it called, what each step cost</text>
  <path d="M290 223 C 325 223, 325 131, 352 131" fill="none" stroke="#6e7681" stroke-width="1.75" marker-end="url(#ah)"/>
  <path d="M720 131 C 752 131, 752 150, 782 150" fill="none" stroke="#6e7681" stroke-width="1.75" marker-end="url(#ah)"/>
  <rect x="360" y="184" width="360" height="78" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="378" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">Quality scores</text>
  <text x="702" y="211" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#79c0ff">ase eval run --push</text>
  <text x="378" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">is the output right: quotes in their sources,</text>
  <text x="378" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">claims supported, scores stable, drafts sound</text>
  <path d="M290 223 C 325 223, 325 223, 352 223" fill="none" stroke="#6e7681" stroke-width="1.75" marker-end="url(#ah)"/>
  <path d="M720 223 C 752 223, 752 150, 782 150" fill="none" stroke="#6e7681" stroke-width="1.75" marker-end="url(#ah)"/>
  <rect x="360" y="276" width="360" height="78" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="378" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">Datasets</text>
  <text x="702" y="303" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#79c0ff">ase dataset push</text>
  <text x="378" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">your researched accounts as test cases to try</text>
  <text x="378" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">a new prompt, model or rubric against</text>
  <path d="M290 223 C 325 223, 325 315, 352 315" fill="none" stroke="#6e7681" stroke-width="1.75" marker-end="url(#ah)"/>
  <path d="M720 315 C 752 315, 752 150, 782 150" fill="none" stroke="#6e7681" stroke-width="1.75" marker-end="url(#ah)"/>
  <rect x="790" y="92" width="240" height="116" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="808" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#e6edf3">Langfuse</text>
  <text x="808" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">open source · cloud or self-hosted</text>
  <text x="808" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#e6edf3">LangSmith</text>
  <text x="808" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">LangChain's platform</text>
  <line x1="808" y1="156" x2="1012" y2="156" stroke="#30363d" stroke-width="1"/>
  <rect x="790" y="222" width="240" height="62" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="808" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">or any OpenTelemetry tool</text>
  <text x="808" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">Phoenix · Jaeger · Grafana</text>
  <text x="790" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ab7df8">Pick one, or connect both</text>
  <text x="790" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ab7df8">to compare them on the same runs.</text>
  <text x="40" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">Metadata only by default (operations, domains, costs, durations, outcomes). Keys stay in your private credentials file.</text>
</svg>
