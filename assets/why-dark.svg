  <circle cx="52" cy="300" r="8" fill="none" stroke="#f85149" stroke-width="1.5"/>
  <path d="M48.5 296.5l7 7M55.5 296.5l-7 7" stroke="#f85149" stroke-width="1.5"/>
  <text x="68" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">nothing you can check</text>
