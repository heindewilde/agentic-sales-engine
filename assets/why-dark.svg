  <text x="416" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Family-owned food wholesaler, Ghent · 3 depots · ~310 staff<tspan fill="#4493f8" font-size="10" dy="-5">[1]</tspan><tspan dy="5"> </tspan></text>
  <rect x="912" y="72" width="98" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="961" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">57 · B</text>
  <text x="961" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9198a1">your rubric</text>
  <text x="416" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9198a1">WHY NOW</text>
  <text x="516" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">Acquired Delcourt Traiteur on 1 Jul 2026, its 9th acquisition since 2015;<tspan fill="#4493f8" font-size="10" dy="-5">[2]</tspan><tspan dy="5"> </tspan></text>
  <text x="516" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">purchasing and administration are being integrated this year</text>
  <text x="416" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9198a1">WHO</text>
  <text x="516" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">Sofie Claes, Finance Director, quoted on the integration<tspan fill="#4493f8" font-size="10" dy="-5">[2]</tspan><tspan dy="5"> </tspan></text>
  <text x="516" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">matches your “finance leader” persona</text>
  <text x="416" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9198a1">SCORE</text>
  <rect x="516" y="251" width="131.60000000000002" height="22" rx="11" fill="#12261e" stroke="#3fb950" stroke-width="1.25"/>
