  <rect x="655.6" y="251" width="119.2" height="22" rx="11" fill="#12261e" stroke="#3fb950" stroke-width="1.25"/>
  <text x="715.2" y="266.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e6edf3">company size <tspan font-weight="700">3/3</tspan></text>
  <rect x="782.8000000000001" y="251" width="100.60000000000001" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="833.1" y="266.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e6edf3">warm path <tspan font-weight="700">0/3</tspan></text>
  <rect x="891.4000000000001" y="251" width="113.0" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="947.9000000000001" y="266.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1">ERP fit <tspan font-weight="700">unknown</tspan></text>
  <text x="516" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1">every level links to a quote · unknowns stay unknown and are researched, not guessed</text>
  <text x="416" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9198a1">FIRST LINE</text>
  <rect x="508" y="312" width="502" height="82" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.25"/>
  <text x="524" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">“Hi Sofie, congrats on the Delcourt acquisition, the ninth since 2015.<tspan fill="#4493f8" font-size="10" dy="-5">[2]</tspan><tspan dy="5"> </tspan></text>
  <text x="524" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">Bringing another entity’s suppliers into one AP process is usually</text>
  <text x="524" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">where the work starts…”</text>
  <text x="416" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9198a1">[1] company site · [2] news, 1 Jul 2026, saved as a snapshot   ·   drafted for you, never sent</text>
