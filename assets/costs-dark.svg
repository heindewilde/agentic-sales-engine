<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="440" viewBox="0 0 1070 440" role="img" aria-label="What it costs: Claude is included in a Claude subscription, data providers cost cents per account, observability is optional; per-stage orders of magnitude and a real example">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
  <rect width="1070" height="440" rx="16" fill="#0d1117"/>
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">Where the money goes</text>
  <rect x="40" y="58" width="318" height="120" rx="12" fill="#0c2d6b" stroke="#1f6feb" stroke-width="1.25"/>
  <text x="60" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9198a1">Claude</text>
  <text x="60" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3fb950">$0 extra</text>
  <text x="60" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">on a Claude subscription: runs use your plan</text>
  <text x="60" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">with an API key: billed per token</text>
  <rect x="376" y="58" width="318" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="396" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9198a1">Data providers</text>
  <text x="396" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">cents / account</text>
  <text x="396" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Exa for search, Firecrawl for pages</text>
  <text x="396" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">both have free tiers, both optional</text>
  <rect x="712" y="58" width="318" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="732" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9198a1">Observability</text>
  <text x="732" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3">optional</text>
  <text x="732" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Langfuse or LangSmith</text>
  <text x="732" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">free tiers · Langfuse can be self-hosted</text>
  <text x="40" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">Per account, roughly</text>
  <text x="1030" y="222" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681">indicative · depends on your providers and models · trending down</text>
  <rect x="40" y="238" width="318" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="60" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6edf3">Discover + light score</text>
  <text x="60" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">well under 1¢ <tspan fill="#9198a1" font-weight="400" font-size="12.5">in data providers</tspan></text>
  <text x="60" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681">API key: well under 1¢</text>
  <rect x="376" y="238" width="318" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="396" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6edf3">Deep research + full score</text>
  <text x="396" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">a few cents <tspan fill="#9198a1" font-weight="400" font-size="12.5">in data providers</tspan></text>
  <text x="396" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681">API key: + tens of cents</text>
  <rect x="712" y="238" width="318" height="92" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="732" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6edf3">Ways in + outreach draft</text>
  <text x="732" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3">about 1¢ <tspan fill="#9198a1" font-weight="400" font-size="12.5">in data providers</tspan></text>
  <text x="732" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681">API key: + cents to tens of cents</text>
  <rect x="40" y="352" width="990" height="34" rx="17" fill="#2e2410" stroke="#d29922" stroke-width="1.25"/>
  <text x="535" y="374" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d29922">A real first cycle: ~150 companies found · 26 researched · 16 drafted  →  under $1.50 in data providers, Claude on the subscription</text>
  <text x="40" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">Cost estimate before deep research · caps checked before every paid call · every call logged in your workspace</text>
</svg>
